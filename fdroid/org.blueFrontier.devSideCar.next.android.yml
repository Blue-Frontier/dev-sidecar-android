# fdroiddata entry for DS NEXT. This file belongs in
# https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/ — it is kept here
# so the build recipe and the build scripts change together.
#
# Everything below matches .github/workflows/build.yml: the same tool versions,
# the same Kotlin archive (by SHA-256) and the same three scripts. F-Droid's
# build VM has network access (its Gradle provisioning sets ten-minute HTTP
# timeouts and fetches dependencies at build time), so the compiler is downloaded
# in prebuild instead of being vendored in this repository.
Categories:
  - Internet
License: MPL-2.0
WebSite: https://github.com/Blue-Frontier/dev-sidecar-android
SourceCode: https://github.com/Blue-Frontier/dev-sidecar-android
IssueTracker: https://github.com/Blue-Frontier/dev-sidecar-android/issues
Changelog: https://github.com/Blue-Frontier/dev-sidecar-android/releases

AutoName: DS NEXT
Summary: A browser that reaches sites blocked by network-level censorship
Description: |
  DS NEXT exists for one situation: a network where sites are blocked by
  poisoning their names or by resetting the connection, and where the usual
  fixes do not help.

  Everything the browser loads goes through a proxy kernel that runs inside the
  app. The kernel applies a ruleset published by the dev-sidecar project: name
  resolution overrides, per-host connection rules and pre-set addresses, plus
  encrypted DNS and TLS Encrypted Client Hello wherever the network allows it.
  When a site is unreachable because its real address cannot be looked up, or
  because its name gives it away, this tries a route that still works.

  What it does not do:

  * No VPN and no system-wide proxy. Only pages opened in DS NEXT go through the
    kernel; other apps on the device are untouched.
  * No account, no advertising, no analytics. The rule bundle is shipped inside
    the app and works offline; fetching a newer one from the project's server is
    optional.
  * No certificate is installed system-wide. Connections the app makes are
    signed by a certificate authority that is generated on the device and used
    only inside this app.

  The ruleset changes as networks change, so a fresh configuration matters: the
  settings screen shows which version is active and can fetch a newer one.

RepoType: git
Repo: https://github.com/Blue-Frontier/dev-sidecar-android.git

# Reproducible builds: F-Droid rebuilds the tag, copies our signature onto its
# own build with apksigcopier, and publishes the developer-signed APK only if the
# payloads match. If the comparison fails the version is skipped silently, so a
# green build is not proof of anything — the published APK and this recipe have
# to be checked against each other.
Binaries: https://github.com/Blue-Frontier/dev-sidecar-android/releases/download/v%v/DS-NEXT-%v-arm64.apk
# Only this certificate may sign the binary above. Without it `fdroid update`
# does not check who signed the APK it publishes under our name.
AllowedAPKSigningKeys: 13e142299f4e42ebca1d034a339e3b789ee379a618abcf186c9b49431bcb6108

Builds:
  - versionName: 0.5.0
    versionCode: 500
    commit: v0.5.0
    submodules: true
    # The image already carries default-jdk-headless (OpenJDK 21 on trixie),
    # unzip and curl, so nothing is installed here on purpose.
    init: |
      set -euo pipefail
      export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
      export BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
      export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
    prebuild: |
      set -euo pipefail
      # Same archive, same checksum as CI: a different compiler emits different
      # dex bytes, and the comparison would fail for the whole release.
      curl --fail --location --silent --show-error --max-time 600 \
        -o kotlin.zip \
        https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
      echo "7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd  kotlin.zip" | sha256sum -c -
      mkdir -p .toolchain
      unzip -q kotlin.zip -d .toolchain
      rm -f kotlin.zip
      chmod +x .toolchain/kotlinc/bin/kotlinc
    build: |
      set -euo pipefail
      export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
      export BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
      export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
      export KOTLINC="$PWD/.toolchain/kotlinc/bin/kotlinc"
      export KOTLIN_STDLIB="$PWD/.toolchain/kotlinc/lib/kotlin-stdlib.jar"
      ./deps/fetch-deps.sh
      ( cd kernel && ./build-kernel-aar.sh android/arm64 )
      ./sync-kernel.sh
      # Unsigned: F-Droid supplies the signature for comparison, and a local
      # development key would only add a second, meaningless one.
      ./build.sh --unsigned
    output: build/dscore-unsigned.apk

MaintainerNotes: |
  No Gradle anywhere: build.sh, sync-kernel.sh and kernel/build-kernel-aar.sh are
  plain bash and run on Debian unchanged. CI runs the same three scripts on
  ubuntu-latest with the same pins (build-tools 37.0.0, NDK 29.0.14206865,
  Kotlin 2.4.21, Go 1.27.3, JDK 21) and rebuilds twice, comparing hashes, so
  nondeterminism is caught before a tag is cut.

  Offline dependencies come from the checkout: deps/vendor/webkit-1.12.1.aar and
  kernel/goproxy (a file:// Go module proxy). The Kotlin archive is the only
  download, pinned by SHA-256 above.

  Known cross-platform difference: libgojni.so differs by a few dozen bytes
  between a Windows and a Linux build (ELF section layout), which is why releases
  are built on Linux only.

