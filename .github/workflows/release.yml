name: Release

# Tag push is the only trigger: it reuses build.yml for both architectures and
# then signs both APKs once, in a job that holds the release key.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
      # Signing is a separate, approved job below, so the matrix build must not
      # need the key at all.
      unsigned: true

  # One approval for the whole release: this is the only job that can see the
  # signing key, and it is a single (non-matrix) job.
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Download unsigned APKs
        uses: actions/download-artifact@v4
        with:
          # One artifact per architecture, produced by the matrix build.
          pattern: DS-NEXT-${{ needs.build.outputs.version }}-*
          merge-multiple: true
          path: release

      - name: Locate apksigner
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          find_signer() {
            find "$sdk/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1
          }
          signer=$(find_signer || true)
          if [ -z "$signer" ]; then
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" >/dev/null
            signer=$(find_signer || true)
          fi
          [ -n "$signer" ] || { echo "apksigner not found" >&2; exit 1; }
          echo "APKSIGNER=$signer" >> "$GITHUB_ENV"

      - name: Sign both APKs with the release key
        env:
          DS_KEYSTORE_B64: ${{ secrets.DS_KEYSTORE_B64 }}
          DS_KEYSTORE_PASS: ${{ secrets.DS_KEYSTORE_PASS }}
          DS_KEY_ALIAS: ${{ secrets.DS_KEY_ALIAS }}
          # Optional repository variable: the certificate the APKs must carry.
          EXPECTED_SIGNER_SHA256: ${{ vars.EXPECTED_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/release.keystore"
          printf '%s' "$DS_KEYSTORE_B64" | base64 -d > "$ks"
          trap 'rm -f "$ks"' EXIT
          mkdir -p signed
          : > "$RUNNER_TEMP/certs.txt"
          for apk in release/*.apk; do
            name=$(basename "$apk")
            # PKCS12 keeps a single password for the store and its key.
            "$APKSIGNER" sign --ks "$ks" --ks-key-alias "$DS_KEY_ALIAS" \
              --v1-signing-enabled false \
              --ks-pass "pass:$DS_KEYSTORE_PASS" \
              --key-pass "pass:$DS_KEYSTORE_PASS" \
              --out "signed/$name" "$apk"
            "$APKSIGNER" verify --print-certs "signed/$name" | tee -a "$RUNNER_TEMP/certs.txt"
            mv "signed/$name" "$apk"
          done
          if [ -n "${EXPECTED_SIGNER_SHA256:-}" ]; then
            grep -qi "$EXPECTED_SIGNER_SHA256" "$RUNNER_TEMP/certs.txt" \
              || { echo "APK is not signed by the expected key" >&2; exit 1; }
          fi
          # The build job's per-ABI sums describe the unsigned files.
          rm -f release/SHA256SUMS-*.txt
          ( cd release && sha256sum *.apk > SHA256SUMS.txt )

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: signed
          path: release/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build, sign]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed APKs
        uses: actions/download-artifact@v4
        with:
          name: signed
          path: release

      - name: Inspect the release files
        run: ls -lah release

      # A fork must not publish a release that looks official or that the update
      # check could pick up, so it gets an alpha suffix and the prerelease flag.
      - name: Compute the release identity
        id: identity
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REPO" = "Blue-Frontier/dev-sidecar-android" ]; then
            echo "title=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          else
            echo "title=$TAG-alpha.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.identity.outputs.title }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --draft \
            --generate-notes \
            --notes "DS NEXT $VERSION。按设备架构各一个包：arm64 对应手机，x86_64 对应模拟器/Chromebook；装错了系统会拒绝安装。旧版本使用公开的调试密钥签名，从本版起改用私有发布密钥：如果安装时提示签名不一致，需要先卸载旧版，此后版本可以直接覆盖升级。"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,name,tagName

      - name: Mark a fork build as prerelease
        if: steps.identity.outputs.is_fork == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,name
