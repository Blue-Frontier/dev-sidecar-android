name: Build

# One build path for every trigger: pushes and PRs build and upload, a tag calls
# this same workflow from release.yml so the released binary is the tested one.
#
# Linux on purpose. F-Droid rebuilds every tagged release on Debian and compares
# the result with the binary published here; sharing the OS removes the biggest
# source of byte differences (aapt2/zipalign are native binaries, and the Windows
# and Linux builds are not guaranteed to emit identical archives).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'dist/**'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version the tag claims (e.g. v0.2.0); must match the manifest
        type: string
        required: false
        default: ''
      unsigned:
        description: Leave the APK unsigned for the release signing job
        type: boolean
        required: false
        default: false
    outputs:
      version:
        description: Version name that ended up in the APK
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # One job per architecture: the kernel is a 19 MB native library, so a fat
    # APK would be twice the size for no benefit. Each job produces its own APK.
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            target: android/arm64
          - abi: x86_64
            target: android/amd64

    # Pinned to the toolchain the app is developed against, and to the versions
    # the F-Droid recipe pins: a rebuilder that uses a different aapt2, d8 or
    # kotlinc gets different dex and resource bytes.
    env:
      KOTLIN_VERSION: '2.4.21'
      BUILD_TOOLS_VERSION: '37.0.0'
      NDK_VERSION: '29.0.14206865'
      ANDROID_PLATFORM: '35'
      MATRIX_ABI: ${{ matrix.abi }}

    outputs:
      version: ${{ steps.version.outputs.name }}

    steps:
      - name: Checkout (with the kernel submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build-tools, platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          sm=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          [ -n "$sm" ] || { echo "sdkmanager not found under $ANDROID_HOME" >&2; exit 1; }
          yes | "$sm" --licenses >/dev/null 2>&1 || true

          # The pinned version is what the release must use; if the repository no
          # longer carries it the build stops instead of silently picking another.
          install_pkg() {
            "$sm" --sdk_root="$ANDROID_HOME" --install "$1;$2" >/dev/null
          }
          install_pkg build-tools "$BUILD_TOOLS_VERSION"
          install_pkg ndk "$NDK_VERSION"
          install_pkg platforms "android-$ANDROID_PLATFORM"

          {
            echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION"
            echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-$ANDROID_PLATFORM/android.jar"
          } >>"$GITHUB_ENV"
          ls -d "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: kernel/go.sum

      - name: Install gomobile
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          # Same version the kernel module pins, so the bindings match go.mod.
          ver=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install "golang.org/x/mobile/cmd/gomobile@$ver"
          go install "golang.org/x/mobile/cmd/gobind@$ver"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - name: Cache the Kotlin compiler
        uses: actions/cache@v4
        id: kotlin-cache
        with:
          path: ${{ github.workspace }}/.toolchain
          key: kotlin-${{ env.KOTLIN_VERSION }}-linux

      - name: Download Kotlin compiler (cache miss)
        if: steps.kotlin-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          mkdir -p .toolchain
          curl --fail --location --silent --show-error -o kotlin.zip "$url"
          unzip -q kotlin.zip -d .toolchain
          rm -f kotlin.zip

      - name: Export toolchain paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "KOTLINC=$GITHUB_WORKSPACE/.toolchain/kotlinc/bin/kotlinc"
            echo "KOTLIN_STDLIB=$GITHUB_WORKSPACE/.toolchain/kotlinc/lib/kotlin-stdlib.jar"
          } >>"$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.toolchain/kotlinc/bin" >>"$GITHUB_PATH"

      # The version lives in the manifest and is committed with the release, so a
      # rebuild from the tag produces the same bytes. Rewriting it here would mean
      # the tag and the manifest disagree, and F-Droid would build something else.
      - name: Verify the version matches the tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -1)
          code=$(sed -n 's/.*android:versionCode="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -1)
          if [ -n "${INPUT_VERSION:-}" ]; then
            want=${INPUT_VERSION#v}
            if [ "$want" != "$manifest" ]; then
              echo "tag says $want but AndroidManifest.xml says $manifest: bump the manifest and commit it before tagging" >&2
              exit 1
            fi
          fi
          # Same formula as build.sh: major*10000 + minor*100 + patch.
          IFS=. read -r major minor patch _ <<<"$manifest"
          expected=$((10#${major//[!0-9]/} * 10000 + 10#${minor//[!0-9]/} * 100 + 10#${patch//[!0-9]/}))
          if [ "$code" != "$expected" ]; then
            echo "versionCode $code does not match $manifest (expected $expected)" >&2
            exit 1
          fi
          echo "name=$manifest" >>"$GITHUB_OUTPUT"
          echo "artifact=DS-NEXT-$manifest-$MATRIX_ABI" >>"$GITHUB_OUTPUT"
          echo "versionName=$manifest versionCode=$code"

      - name: Fetch the plain-jar dependencies
        shell: bash
        run: |
          # No Gradle: each AAR is unpacked to its classes.jar, which is all
          # kotlinc and d8 need. deps/vendor/ wins over the network.
          ./deps/fetch-deps.sh

      - name: Build the kernel AAR
        working-directory: kernel
        shell: bash
        run: |
          ./build-kernel-aar.sh ${{ matrix.target }}

      - name: Sync the kernel into the app
        shell: bash
        run: |
          ./sync-kernel.sh

      - name: Build the APK
        shell: bash
        run: |
          # Release builds hand the APK to the signing job in release.yml; the
          # other triggers sign with a throwaway local key so the artifact stays
          # installable for testers.
          if [ "${{ inputs.unsigned }}" = "true" ]; then
            ./build.sh --unsigned
          else
            ./build.sh
          fi

      # The gate that keeps reproducible builds reproducible: same commit, same
      # toolchain, twice. F-Droid compares its own rebuild against our unsigned
      # payload, so nondeterminism here would silently break every release.
      - name: Verify the build is reproducible
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh --unsigned >/dev/null
          cp build/dscore-unsigned.apk /tmp/first.apk
          ./build.sh --unsigned >/dev/null
          first=$(sha256sum /tmp/first.apk | cut -d' ' -f1)
          second=$(sha256sum build/dscore-unsigned.apk | cut -d' ' -f1)
          echo "first  $first"
          echo "second $second"
          if [ "$first" != "$second" ]; then
            echo "the same source produced two different APKs; a rebuild would not match this release" >&2
            exit 1
          fi

      - name: Collect the release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          src=build/dscore.apk
          if [ -f build/dscore-unsigned.apk ]; then src=build/dscore-unsigned.apk; fi
          cp "$src" "release/${{ steps.version.outputs.artifact }}.apk"
          sha256sum "release/${{ steps.version.outputs.artifact }}.apk" \
            | sed "s| .*|  ${{ steps.version.outputs.artifact }}.apk|" \
            > "release/SHA256SUMS-$MATRIX_ABI.txt"
          ls -l release

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
